name: 'gitpulse'
version: '1.0.0'
config-version: 2

# Path configurations
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
helper-paths: ["helpers"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configure profile to match profiles.yml
profile: 'gitpulse'

# Materialization configurations
models:
  gitpulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

snapshots:
  gitpulse:
    +target_schema: marts

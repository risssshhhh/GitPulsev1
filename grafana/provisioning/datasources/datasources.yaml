apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    database: gitpulse
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: 'disable'
      connMaxLifetime: 14400
      postgresVersion: 1500 # PostgreSQL 15
      timescaledb: false
    isDefault: true
